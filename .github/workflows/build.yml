name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate macOS .icns from PNGs
        if: runner.os == 'macOS'
        run: |
          mkdir -p droppointplus/resources/icons/droppoint.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s droppointplus/resources/icons/pngLogo/droppoint.png \
              --out droppointplus/resources/icons/droppoint.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) droppointplus/resources/icons/pngLogo/droppoint.png \
              --out droppointplus/resources/icons/droppoint.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns droppointplus/resources/icons/droppoint.iconset \
            -o droppointplus/resources/icons/droppoint.icns
          ls -la droppointplus/resources/icons/droppoint.icns
      - name: PyInstaller build (spec)
        run: pyinstaller --noconfirm DropPointPlus.spec

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: packaging/windows
        run: |
          choco install nsis -y --no-progress
          # choco's NSIS package puts makensis under Program Files and does not
          # reliably add it to PATH, so locate it explicitly (falling back to
          # the 32-bit dir and a plain PATH lookup).
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            (Get-Command makensis -ErrorAction SilentlyContinue).Source
          )
          $makensis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) {
            Write-Error "makensis.exe not found. Tried: $($candidates -join ', ')"
            exit 1
          }
          Write-Host "using makensis: $makensis"
          & $makensis /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-windows
          path: |
            dist/DropPointPlus/
            packaging/windows/DropPointPlus-Setup-*.exe

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "DropPoint+" \
            -srcfolder dist/DropPointPlus.app \
            -ov -format UDZO dist/DropPointPlus.dmg
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-macos
          path: |
            dist/DropPointPlus.app/
            dist/DropPointPlus.dmg

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-linux
          path: |
            dist/DropPointPlus/
            dist/DropPointPlus-x86_64.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DropPointPlus-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: DropPointPlus-macos
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: DropPointPlus-linux
          path: release/linux
      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/DropPointPlus-Setup-*.exe
            release/macos/**/*.dmg
            release/linux/**/*.AppImage
          generate_release_notes: false
