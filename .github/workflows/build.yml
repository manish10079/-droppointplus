name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PyInstaller build (spec)
        run: pyinstaller --noconfirm DropPointPlus.spec

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          makensis /V2 packaging/windows/installer.nsi
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-windows
          path: |
            dist/DropPointPlus/
            DropPointPlus-Setup-*.exe

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "DropPoint+" \
            -srcfolder dist/DropPointPlus.app \
            -ov -format UDZO dist/DropPointPlus.dmg
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-macos
          path: |
            dist/DropPointPlus.app/
            dist/DropPointPlus.dmg

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_appimage.sh
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DropPointPlus-linux
          path: |
            dist/DropPointPlus/
            dist/DropPointPlus-x86_64.AppImage
