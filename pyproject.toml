[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droppointplus"
version = "0.1.0"
description = "Drag-and-drop shelf — PySide6 rebuild of the DropPoint Electron app"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.6",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
droppointplus = "droppointplus.main:main"

[tool.setuptools]
packages = ["droppointplus", "droppointplus.widgets"]

[tool.setuptools.package-data]
droppointplus = ["resources/icons/*", "resources/icons/pngLogo/*"]
